# Define configuration name and status log level
name = PropertiesConfig
status = warn

# Define reusable properties
property.filename = logs/app.log
property.filePattern = logs/app-%d{yyyy-MM-dd-HH-mm}.log

# Declare only the rolling file appender
appenders = rolling

# Rolling File Appender Configuration (Rotates every minute)
appender.rolling.type = RollingFile
appender.rolling.name = LOGFILE
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = ${filePattern}
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true

# Root Logger Configuration (File only)
rootLogger.level = info
rootLogger.appenderRefs = rolling
rootLogger.appenderRef.rolling.ref = LOGFILE
