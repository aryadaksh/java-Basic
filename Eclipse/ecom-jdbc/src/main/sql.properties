# CUSTOMER

customer.insert=INSERT INTO customers(customer_name,email,mobile,address) VALUES(?,?,?,?)
customer.update=UPDATE customers SET customer_name=?,email=?,mobile=?,address=? WHERE customer_id=?
customer.delete=DELETE FROM customers WHERE customer_id=?
customer.findById=SELECT * FROM customers WHERE customer_id=?
customer.findByEmail=SELECT * FROM customers WHERE email=?
customer.findAll=SELECT * FROM customers


# PRODUCT

product.insert=INSERT INTO products(product_name,category,price,quantity,brand) VALUES(?,?,?,?,?)
product.update=UPDATE products SET product_name=?,category=?,price=?,quantity=?,brand=? WHERE product_id=?
product.delete=DELETE FROM products WHERE product_id=?

product.findById=SELECT * FROM products WHERE product_id=?
product.findByName=SELECT * FROM products WHERE LOWER(product_name) LIKE LOWER(?)
product.findByCategory=SELECT * FROM products WHERE LOWER(category) LIKE LOWER(?)
product.findByBrand=SELECT * FROM products WHERE LOWER(brand) LIKE LOWER(?)

product.findAll=SELECT * FROM products
product.availableStock=SELECT * FROM products WHERE quantity > 0

product.updateStock=UPDATE products SET quantity=? WHERE product_id=?
product.reduceStock=UPDATE products SET quantity=quantity-? WHERE product_id=?
product.increaseStock=UPDATE products SET quantity=quantity+? WHERE product_id=?


# CART

cart.add=INSERT INTO cart(customer_id,product_id,quantity) VALUES(?,?,?)
cart.remove=DELETE FROM cart WHERE cart_id=?
cart.updateQuantity=UPDATE cart SET quantity=? WHERE cart_id=?

cart.view=SELECT * FROM cart WHERE customer_id=?
cart.clear=DELETE FROM cart WHERE customer_id=?

cart.total=SELECT SUM(p.price*c.quantity) AS total FROM cart c JOIN products p ON c.product_id=p.product_id WHERE c.customer_id=?


# ORDERS

order.insert=INSERT INTO orders(customer_id,total_amount,order_date,order_status) VALUES(?,?,?,?)
order.findById=SELECT * FROM orders WHERE order_id=?
order.findByCustomerId=SELECT * FROM orders WHERE customer_id=?
order.findAll=SELECT * FROM orders
order.updateStatus=UPDATE orders SET order_status=? WHERE order_id=?


# ORDER ITEMS

orderItem.insert=INSERT INTO order_items(order_id,product_id,quantity,item_price) VALUES(?,?,?,?)
orderItem.findByOrderId=SELECT * FROM order_items WHERE order_id=?
orderItem.deleteByOrderId=DELETE FROM order_items WHERE order_id=?


# LOGIN

customer.login=SELECT * FROM user_credentials WHERE username=? AND password=?

admin.login=SELECT * FROM user_credentials WHERE username=? AND password=? AND role='ADMIN'
